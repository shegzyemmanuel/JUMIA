
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Jumia</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="auth-header">
        <a href="./index.html" class="jumia-logo">Jumia</a>
        <a href="./login.html" class="header-link">Sign In</a>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-heading">
                <h1>Create your account</h1>
                <p>Welcome! Join us for a better shopping experience.</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label for="full-name">Full name</label>
                    <input
                        type="text"
                        id="full-name"
                        name="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="register-email">Email address</label>
                    <input
                        type="email"
                        id="register-email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input
                        type="password"
                        id="register-password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                    <small>Use at least 8 characters.</small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirmPassword"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <p id="register-message" class="auth-message"
                   role="status" aria-live="polite"></p>

                <button type="submit" class="auth-button">
                    Create Account
                </button>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="./login.html">Sign In</a>
            </p>
        </section>

        <p class="auth-footer">
            Your shopping journey starts here.
        </p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase.js"></script>
<script src="./auth.js"></script>
</body>
</html>
</body>
</html>
